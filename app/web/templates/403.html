{% extends "base.html" %}
{% block title %}Acceso denegado · {{ app_name }}{% endblock %}

{% block content %}
<div class="mx-auto mt-16 max-w-md rounded-2xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
  <div class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-full bg-red-100 text-red-600">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
    </svg>
  </div>
  <h1 class="text-lg font-semibold">Acceso denegado</h1>
  <p class="mt-2 text-sm text-slate-500">{{ detalle or 'No tiene permisos para esta sección.' }}</p>
  <a href="/panel" class="mt-6 inline-block rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
    Volver al panel
  </a>
</div>
{% endblock %}

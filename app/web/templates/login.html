{% extends "base.html" %}
{% block title %}Ingresar · {{ app_name }}{% endblock %}

{% block content %}
<div class="mx-auto mt-10 max-w-md">
  <div class="mb-6 text-center">
    <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl bg-indigo-600 text-xl font-bold text-white shadow-lg">
      DM
    </div>
    <h1 class="text-2xl font-semibold tracking-tight">{{ app_name }}</h1>
    <p class="text-sm text-slate-500">Seguimiento de documentos municipales</p>
  </div>

  <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700 ring-1 ring-red-200">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Correo</label>
        <input id="email" name="email" type="email" required autofocus
               value="{{ email or '' }}"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
               placeholder="usuario@municipalidad.gob.pe">
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Contraseña</label>
        <input id="password" name="password" type="password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
               placeholder="••••••••">
      </div>

      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
        Ingresar
      </button>
    </form>
  </div>

  <p class="mt-4 text-center text-xs text-slate-400">
    Acceso restringido al personal autorizado.
  </p>
</div>
{% endblock %}
